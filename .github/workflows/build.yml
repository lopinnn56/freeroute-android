name: build-apk

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # nodejs-mobile 运行时版本：决定 APK 内嵌的 Node 版本与 ABI。
  # release 资产是单 zip 含全部 ABI（bin/<abi>/libnode.so + include/node/ 头文件）。
  NODEJS_MOBILE_VERSION: v18.20.4

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验引擎（Node 语法 + 端到端）
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 引擎自检
        working-directory: engine
        run: |
          node --check shim.js
          node --check engine.mjs
          node --check start.mjs
          node sync-assets.mjs
          timeout 120 node test.mjs

      - name: 准备 Node 运行时（libnode.so + 头文件）
        run: |
          set -euo pipefail
          VER="$NODEJS_MOBILE_VERSION"
          ABI="arm64-v8a"
          if [ ! -f "android/app/src/main/jniLibs/$ABI/libnode.so" ]; then
            ZIP="/tmp/nodejs-mobile-${VER}-android.zip"
            URL="https://github.com/nodejs-mobile/nodejs-mobile/releases/download/${VER}/nodejs-mobile-${VER}-android.zip"
            echo "下载 $URL"
            curl -fSL --retry 3 -o "$ZIP" "$URL"
            rm -rf /tmp/njm && mkdir -p /tmp/njm
            unzip -q "$ZIP" -d /tmp/njm
            # 运行时 .so → jniLibs/<abi>/（打进 APK）
            mkdir -p "android/app/src/main/jniLibs/$ABI"
            cp "/tmp/njm/bin/$ABI/libnode.so" "android/app/src/main/jniLibs/$ABI/libnode.so"
            # C 头文件 → android/app/libnode/include/node（仅供 JNI 桥编译，不打包）
            mkdir -p android/app/libnode
            cp -r /tmp/njm/include android/app/libnode/include
          fi
          ls -lh android/app/src/main/jniLibs/$ABI/libnode.so
          test -f android/app/libnode/include/node/node.h && echo "头文件就位"

      - name: 安装 NDK + CMake（可选，失败时由 AGP 自动下载）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            # 不用 `yes |` 管道：sdkmanager 提前退出会让 yes 触发 SIGPIPE，
            # 在 pipefail 下会把整步判失败。runner 上 SDK 许可已预接受，
            # 直接喂 /dev/null 即可；安装失败也无妨，AGP 会自行下载。
            "$SDKMGR" --install "ndk;26.3.11579264" "cmake;3.22.1" </dev/null \
              || echo "sdkmanager 安装失败，将由 AGP 自动下载 NDK/CMake"
          else
            echo "未找到 sdkmanager（$SDKMGR）——将由 AGP 自动安装"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          # 注意：不能开 gradle-home-cache-cleanup——它会在 Post Run 阶段跑一个
          # dummy-cleanup 构建，用到 Gradle 8.7 的只写属性 removeUnusedEntriesOlderThan，
          # 与 gradle/actions@v3 不兼容导致整个 run 被判红（构建本身其实已成功）。

      - name: 还原签名 keystore（来自 secrets）
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$RUNNER_TEMP"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "keystore 已还原: $RUNNER_TEMP/release.keystore"
            test -s "$RUNNER_TEMP/release.keystore"
          else
            echo "无 ANDROID_KEYSTORE_BASE64 —— 将回退 debug 签名"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: 构建 Release APK（固定签名）
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 验证签名指纹（固定 keystore）
        if: always()
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "签名证书指纹："
          # 定位 runner 自带 apksigner（Android SDK build-tools），支持 v1/v2/v3
          APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/"*/apksigner 2>/dev/null | tail -1)
          if [ -z "$APKSIGNER" ]; then APKSIGNER=$(command -v apksigner); fi
          echo "apksigner: ${APKSIGNER:-未找到}"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "$APKSIGNER" ]; then
            EXPECTED=D298A364723097E3E6E167B5560A1F60897641BD29D031464772B62C9F80646B
            ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -i "SHA-256 digest:" | awk '{print $NF}' | tr '[:lower:]' '[:upper:]')
            echo "期望指纹: $EXPECTED"
            echo "实际指纹: $ACTUAL"
            if [ -n "$ACTUAL" ] && [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "✓ 使用固定 keystore 签名，可原地升级安装"
            else
              echo "⚠️ 指纹不匹配或无法读取——升级安装可能被拒"
              exit 1
            fi
          else
            echo "未配置 secrets 或缺少 apksigner，跳过严格校验"
          fi

      - name: 收集产物（带版本号命名）
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./engine/package.json').version" 2>/dev/null || echo "0.0.0")
          SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          mkdir -p out
          for f in android/app/build/outputs/apk/release/*.apk; do
            NAME="freeroute-v${VERSION}-${SHA}.apk"
            cp -v "$f" "out/$NAME"
          done
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: freeroute-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 发布到 Releases（每次 main 推送/手动构建）
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./engine/package.json').version" 2>/dev/null || echo "0.0.0")
          SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          APK=$(ls out/freeroute-*.apk | head -1)
          TAG="continuous-latest"
          # 用 gh CLI 创建/更新持续构建 release，并覆盖同名资产
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "更新既有 release: $TAG"
            gh release upload "$TAG" "$APK" --clobber
          else
            echo "创建新 release: $TAG"
            gh release create "$TAG" "$APK" \
              --title "FreeRoute 持续构建 v${VERSION} (${SHA})" \
              --notes "自动构建：v${VERSION} @ ${SHA} · ${GITHUB_RUN_ID}" || true
          fi
          gh release view "$TAG" --json tagName,name,assets --jq '.assets[] | .name' | sed 's/^/已上传到 Release: /'

      - name: 附加到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk