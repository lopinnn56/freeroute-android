plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'dev.freeroute.app'
  compileSdk 34
  // CI 显式安装该版本（见 .github/workflows/build.yml）；AGP 会按此匹配
  ndkVersion '26.3.11579264'

  defaultConfig {
    applicationId "dev.freeroute.app"
    minSdk 24
    targetSdk 34
    // 自动版本号：CI 传 -PversionCode / -PversionName（构建号单调递增，
    // Android 据此判定可升级覆盖）；本地不传则用兜底值。
    versionCode (project.findProperty('versionCode') as Integer ?: 2)
    versionName (project.findProperty('versionName') ?: "0.8.20")
    ndk {
      // 只打包 arm64-v8a：Node 运行时的体积决定不宜再放宽
      abiFilters 'arm64-v8a'
    }
    externalNativeBuild {
      cmake {
        // nodejs-mobile 的桥按 c++_shared 构建（见 native-lib.cpp）
        arguments '-DANDROID_STL=c++_shared'
      }
    }
  }

  // 宿主 JNI 桥（native-lib.cpp → node::Start()）随 NDK 编译
  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
      version '3.22.1'
    }
  }

  // 稳定签名：CI 由 workflow 把 keystore 从 secrets 解码写入固定路径，
  // 每次构建用同一把 key 签名，产出的 APK 可原地升级安装（无需卸载重装）。
  // 未配置时（如本地无签名环境）回退 android 自带 debug 签名，构建不中断。
  def storeFileEnv = System.getenv('ANDROID_KEYSTORE_FILE')
  def storePassEnv = System.getenv('ANDROID_KEYSTORE_PASSWORD')
  def ksFileObj = (storeFileEnv && new File(storeFileEnv).isFile()) ? new File(storeFileEnv) : null

  signingConfigs {
    release {
      if (ksFileObj != null && storePassEnv) {
        storeFile ksFileObj
        storePassword storePassEnv
        keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'freeroute'
        keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: storePassEnv
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      shrinkResources false
      if (ksFileObj != null && storePassEnv) {
        signingConfig signingConfigs.release
      } else {
        signingConfig signingConfigs.debug
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }

  packagingOptions {
    jniLibs { useLegacyPackaging = true }
  }

  // 引擎与 Web UI 是构建产物（由 engine/sync-assets.mjs 生成），不做 lint 阻塞
  lint { abortOnError false }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.core:core-ktx:1.13.1'
  // Node 运行时以 libnode.so 形式随 jniLibs/arm64-v8a/ 打包，
  // 由 .github/workflows/build.yml 从 nodejs-mobile release 下载，
  // 因此这里不需要（也不应）声明任何 Node 相关的 Maven 依赖。
}

// 将 engine/ 与 webui/ 的最新副本同步进 assets，保证 APK 与源码一致
tasks.register('syncEngineAssets', Exec) {
  workingDir rootProject.projectDir.parentFile
  commandLine 'node', 'engine/sync-assets.mjs'
}
tasks.named('preBuild') { dependsOn 'syncEngineAssets' }
